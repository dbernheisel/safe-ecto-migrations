version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: test_adding_json_column
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - ./migrations:/migrations
