version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: test_02_adding_foreign_key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - ./migrations:/migrations
      - ../shared:/shared
      - .:/test
    working_dir: /test
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c log_lock_waits=on -c deadlock_timeout=1000ms
